[package]
name = "ad-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "After Dark 1.0a Windows 11 native host (Control Panel, Tray, Hot Corners, Multi-Monitor, HiDPI)"

[[bin]]
name = "after-dark"
path = "src/main.rs"

[dependencies]
ad-sdk = { path = "../ad-sdk" }
ad-modules = { path = "../ad-modules" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
